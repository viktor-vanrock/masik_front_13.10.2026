deploy_dev:
  extends: .kube_deploy
  stage: deploy
  tags:
    - kubernetes-std
  rules:
    - if: $CI_COMMIT_BRANCH == 'develop'
  when: manual
  variables:
    ENVIRONMENT: develop
    APP_NAME: benchmark-catalog-front
    APP_NAMESPACE: d-rndbtoc-projects
    CHART_DIR: ./helm
    CHART_NAME: "."
    CHART_REF: "master"
    CHART_REPO: https://gitlab-ci-token:$CI_JOB_TOKEN@git.sberdevices.ru/rndml/devops/helm-template.git
    CHART_VALUES: advosd-benchmark-catalog-front-dev
    VALUES_PATH: envs/advosd-benchmark-catalog-front-dev.yml
    CI_PROJECT_NAMESPACE: rndbtoc/benchmark-catalog
    OC_SERVER: "https://api.advosd.sberdevices.ru:6443"
    OC_TOKEN: $OC_TOKEN

deploy_prod:
  extends: .kube_deploy
  stage: deploy
  tags:
    - p-deployer
  rules:
    - if: $CI_COMMIT_BRANCH == 'main'
  when: manual
  variables:
    ENVIRONMENT: production
    APP_NAME: benchmark-catalog-front
    APP_NAMESPACE: p-rndbtoc-projects
    CHART_DIR: ./helm
    CHART_NAME: "."
    CHART_REF: "master"
    CHART_REPO: https://gitlab-ci-token:$CI_JOB_TOKEN@git.sberdevices.ru/rndml/devops/helm-template.git
    CHART_VALUES: advosp-benchmark-catalog-front-prod
    VALUES_PATH: envs/advosp-benchmark-catalog-front-prod.yml
    CI_PROJECT_NAMESPACE: rndbtoc/benchmark-catalog
    OC_SERVER: "https://api.advosp.sberdevices.ru:6443"
    OC_TOKEN: $OC_TOKEN
