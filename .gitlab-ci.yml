include:
  - project: 'rndml-public/devops/job-templates'
    file:
      - '.nodejs-templates.yml'
      - '.deploy.yml'
  - '.deploy.yml'

variables:
  NPM_REGISTRY: https://nexus.sberdevices.ru/repository/Npm/

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - .npm/
  policy: pull-push

stages:
  - prepare
  - build
  - test
  - pack
  - deploy

.rules:
  rules_main:
    - if: $CI_COMMIT_BRANCH == 'develop'
    - if: $CI_COMMIT_BRANCH == 'main'

get_version:
  extends: .version
  rules:
    - !reference [.rules, rules_main]

build:
  extends: .build_static
  tags:
    - d-rndml-build
  image: registry.sberdevices.ru/rndml/devops/dockerfiles/nodejs-runtime-24:24.13
  rules:
    - !reference [.rules, rules_main]
  script:
    - |
      if [[ $NPM_REGISTRY != "" ]]; then
        npm config set registry $NPM_REGISTRY
        echo "SET registry - $NPM_REGISTRY"
      fi
    - export NODE_OPTIONS="--max-old-space-size=8192"
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/
      - node_modules/

check_lint:
  stage: test
  extends: .linter
  tags:
    - d-rndml-build
  image: registry.sberdevices.ru/rndml/devops/dockerfiles/nodejs-runtime-24:24.13
  dependencies:
    - build
  script:
    - npm run lint
  rules:
    - !reference [.rules, rules_main]
  allow_failure: true

check_test:
  stage: test
  tags:
    - d-rndml-build
  image: registry.sberdevices.ru/rndml/devops/dockerfiles/nodejs-runtime-24:24.13
  dependencies:
    - build
  script:
    - npm run test
  rules:
    - !reference [.rules, rules_main]
  allow_failure: true

docker_kaniko:
  stage: pack
  extends: .kaniko
  dependencies:
    - get_version
    - build
  rules:
    - !reference [.rules, rules_main]
